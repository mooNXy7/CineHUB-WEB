name: Validate CineHUB WEB

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout CineHUB WEB
        uses: actions/checkout@v4

      - name: Validate site structure and syntax
        shell: bash
        run: |
          set -euo pipefail
          test -s index.html
          test -s manifest.json
          test -s service-worker.js
          test -d src/css
          test -d src/js
          test -d dados
          python3 - <<'PY'
          from pathlib import Path
          import json, subprocess
          root = Path('.')
          json_files = list(root.rglob('*.json'))
          for path in json_files:
              json.loads(path.read_text(encoding='utf-8'))
          js_files = list(root.rglob('*.js'))
          for path in js_files:
              subprocess.run(['node', '--check', str(path)], check=True)
          print(f'Valid JSON files: {len(json_files)}')
          print(f'JavaScript syntax checks: {len(js_files)}')
          PY
